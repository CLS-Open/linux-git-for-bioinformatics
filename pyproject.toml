[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioflow"
version = "0.1.0"
description = "Auditable minimal pipeline runner and sequence-QC toolkit for teaching reproducible bioinformatics workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ademola Emmanuel Tolulope" }]
keywords = ["bioinformatics", "workflow", "reproducibility", "education", "fastq", "open-education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.8", "nbclient>=0.10", "nbformat>=5.10", "jupyter-client>=8", "ipykernel>=6.29"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
bioflow = "bioflow.cli:main"

[project.urls]
Homepage = "https://github.com/cls-open/linux-git-for-bioinformatics"
Documentation = "https://cls-open.github.io/linux-git-for-bioinformatics/"
Changelog = "https://github.com/cls-open/linux-git-for-bioinformatics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bioflow"]
